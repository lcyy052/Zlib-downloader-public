<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">电子书从网站保存到本地的四个步骤</title>
  <desc id="desc">用户发起任务，浏览器处理登录，下载程序保存文件，书单文件夹完成整理。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#173f35" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7da895"/>
    </marker>
  </defs>
  <rect width="1440" height="620" rx="36" fill="#f6f5ee"/>
  <text x="80" y="92" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="38" font-weight="700" fill="#173f35">一本书是怎样安稳落到电脑里的？</text>
  <text x="80" y="138" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="22" fill="#66756f">把复杂的下载过程，拆成四个简单、各司其职的步骤</text>

  <g stroke="#7da895" stroke-width="6" fill="none" marker-end="url(#arrow)">
    <path d="M338 348 H410"/>
    <path d="M678 348 H750"/>
    <path d="M1018 348 H1090"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="210" width="270" height="280" rx="28" fill="#ffffff"/>
    <rect x="410" y="210" width="270" height="280" rx="28" fill="#ffffff"/>
    <rect x="750" y="210" width="270" height="280" rx="28" fill="#ffffff"/>
    <rect x="1090" y="210" width="270" height="280" rx="28" fill="#ffffff"/>
  </g>

  <g font-family="Microsoft YaHei, PingFang SC, sans-serif" text-anchor="middle">
    <circle cx="205" cy="288" r="48" fill="#e3efe7"/>
    <text x="205" y="305" font-size="48">👆</text>
    <text x="205" y="382" font-size="28" font-weight="700" fill="#173f35">选择书籍</text>
    <text x="205" y="426" font-size="20" fill="#66756f">搜索一本书</text>
    <text x="205" y="457" font-size="20" fill="#66756f">或粘贴一份书单</text>

    <circle cx="545" cy="288" r="48" fill="#e3efe7"/>
    <text x="545" y="305" font-size="48">🌐</text>
    <text x="545" y="382" font-size="28" font-weight="700" fill="#173f35">浏览器确认</text>
    <text x="545" y="426" font-size="20" fill="#66756f">沿用正常登录状态</text>
    <text x="545" y="457" font-size="20" fill="#66756f">需要验证时交给用户</text>

    <circle cx="885" cy="288" r="48" fill="#e3efe7"/>
    <text x="885" y="305" font-size="48">⬇️</text>
    <text x="885" y="382" font-size="28" font-weight="700" fill="#173f35">程序稳妥保存</text>
    <text x="885" y="426" font-size="20" fill="#66756f">逐本下载并显示进度</text>
    <text x="885" y="457" font-size="20" fill="#66756f">失败不会拖住整批任务</text>

    <circle cx="1225" cy="288" r="48" fill="#e3efe7"/>
    <text x="1225" y="305" font-size="48">📁</text>
    <text x="1225" y="382" font-size="28" font-weight="700" fill="#173f35">自动整理</text>
    <text x="1225" y="426" font-size="20" fill="#66756f">按书单名称建文件夹</text>
    <text x="1225" y="457" font-size="20" fill="#66756f">已有文件自动跳过</text>
  </g>

  <rect x="70" y="535" width="1290" height="2" fill="#d8e2dc"/>
  <text x="720" y="578" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#6d7a75">浏览器负责“看懂网页”，下载程序负责“把文件保存好”</text>
</svg>
